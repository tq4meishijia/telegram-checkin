name = "tg-checkin"
main = "src/index.ts"
# compatibility_date 暂保持 2025-04-01：升级会改变运行时行为，需在 wrangler dev 下
# 完整回归（登录/cron/ GramJS 连接）后再上调，不作为常规维护动作。
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["* * * * *"]

[assets]
directory = "./public"
binding = "ASSETS"
# 页面路径先打到 Worker：/api/* 由 Hono 处理，其余走 catch-all 回退到 ASSETS 并附加 CSP 头。
# 注：dev 实测 JS/CSS 由 assets 层直接服务、不经过 Worker 故不带头；CSP 为文档级策略，
# HTML 带头即生效（详见 AGENT_HANDOFF §5）。
run_worker_first = ["/"]

# Workers 日志（Tail Workers 之外的内置可观测），排障时在面板 Logs 查看
[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "tg-checkin-db"
database_id = "5965162f-0f03-4f75-875f-7e3724cb7e2a"
