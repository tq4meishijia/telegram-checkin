name = "telegram-checkin"
main = "src/index.ts"
# compatibility_date 暂保持 2025-04-01：升级会改变运行时行为，需在 wrangler dev 下
# 完整回归（登录/cron/ GramJS 连接）后再上调，不作为常规维护动作。
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["* * * * *"]

[assets]
directory = "./public"
binding = "ASSETS"
# 页面与静态资源都先打到 Worker：/api/* 由 Hono 处理，其余走 catch-all 回退到 ASSETS
# 并统一附加 CSP 头（含 /app.js、/style.css；dev 实测需显式列出才经过 Worker）。
run_worker_first = ["/", "/app.js", "/style.css"]

# Workers 日志（Tail Workers 之外的内置可观测），排障时在面板 Logs 查看
[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "telegram-checkin-db"
# ⚠️ database_id 为旧账号下已不存在的库（5965162f…，7404 实测）。
# 全新部署时：npx wrangler d1 create telegram-checkin-db，把输出的 id 填到这里。
database_id = "5965162f-0f03-4f75-875f-7e3724cb7e2a"
